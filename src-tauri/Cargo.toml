[package]
name = "luci"
version = "1.0.0"
description = "Luci — private local anime app"
authors = ["you"]
edition = "2021"

[lib]
name = "luci_lib"
crate-type = ["rlib"]
# All tests live in tests/db_tests.rs (integration). The empty lib unittest
# harness binary hits STATUS_ENTRYPOINT_NOT_FOUND at loader time on
# windows-gnu, so disable it. If you add #[cfg(test)] unit tests inside src/,
# remove this line again.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
